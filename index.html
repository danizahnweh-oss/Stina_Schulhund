<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schulhund-Lernwebsite · Prüfungsvorbereitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&amp;family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5EC;
  --bg2:#F3EADA;
  --karte:#FFFFFF;
  --tinte:#41382B;
  --leise:#726445;
  --linie:#E8DECC;
  --akzent:#C2693F;
  --akzent-dunkel:#A85531;
  --akzent-hell:#F6E3D7;
  --gruen:#6F8F5E;
  --gruen-hell:#E9F0E2;
  --rot:#B5503C;
  --rot-hell:#F7E2DD;
  --gelb:#E0A436;
  --g-sand:#CDB892;
  --g-blau:#5E7CA6;
  --g-mauve:#B07AA1;
  --g-gruen:#6F8F5E;
  --g-rost:#B5503C;
  --g-gold:#C9A227;
  --radius:18px;
  --schatten:0 2px 10px rgba(95,75,50,.08), 0 1px 3px rgba(95,75,50,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--tinte);
  font-size:16.5px;
  line-height:1.6;
}
h1,h2,h3,.knopf,.tab,.mk-nr,.nav-nr{font-family:'Fredoka',sans-serif;font-weight:500}
h1{font-size:2.1rem;line-height:1.15;margin:.2em 0 .3em}
h2{font-size:1.35rem;margin:0 0 .6em}
h3{font-size:1.12rem;margin:0 0 .35em}
a{color:var(--akzent-dunkel)}
strong{font-weight:800}

/* ---------- Kopfzeile ---------- */
header.kopf{
  position:sticky;top:0;z-index:50;
  background:rgba(250,245,236,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linie);
  display:flex;align-items:center;gap:16px;
  padding:10px 20px;
}
.marke{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-size:1.12rem;white-space:nowrap}
.marke .pfote{transform:scale(1.05)}
#menue-knopf{display:none;border:1px solid var(--linie);background:var(--karte);border-radius:10px;padding:6px 10px;font-size:1.05rem;cursor:pointer;color:var(--tinte)}
#countdown{margin-left:auto;font-size:.92rem;color:var(--leise);white-space:nowrap}
#countdown strong{color:var(--akzent-dunkel)}
.kopf-fortschritt{display:flex;align-items:center;gap:8px;min-width:140px}
.kopf-balken-rahmen{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;min-width:70px}
#kopf-balken{height:100%;background:linear-gradient(90deg,var(--gelb),var(--akzent));border-radius:99px;width:0;transition:width .4s}
#kopf-prozent{font-size:.85rem;font-weight:800;color:var(--akzent-dunkel)}

/* ---------- Pfote (reine Kreise) ---------- */
.pfote{position:relative;display:inline-block;width:20px;height:20px;vertical-align:-3px}
.pfote b{position:absolute;left:4px;top:8px;width:12px;height:10px;border-radius:50% 50% 56% 56%;background:var(--akzent)}
.pfote i{position:absolute;top:1px;width:5px;height:6px;border-radius:50%;background:var(--akzent)}
.pfote i:nth-child(1){left:1px;top:4px}
.pfote i:nth-child(2){left:7.5px;top:0}
.pfote i:nth-child(3){left:14px;top:4px}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:calc(100vh - 57px)}
nav#seitenleiste{
  width:268px;flex:0 0 268px;
  border-right:1px solid var(--linie);
  padding:18px 12px 40px;
  background:var(--bg);
}
main#inhalt{flex:1;min-width:0;padding:30px clamp(18px,4vw,56px) 80px;max-width:1060px}

.nav-eintrag{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;margin:2px 0;border-radius:12px;
  text-decoration:none;color:var(--tinte);font-size:.93rem;line-height:1.3;
}
.nav-eintrag:hover{background:var(--bg2)}
.nav-eintrag.aktiv{background:var(--akzent-hell);color:var(--akzent-dunkel);font-weight:700}
.nav-nr{flex:0 0 24px;height:24px;border-radius:50%;background:var(--bg2);color:var(--leise);display:flex;align-items:center;justify-content:center;font-size:.78rem}
.nav-eintrag.aktiv .nav-nr{background:var(--akzent);color:#fff}
.nav-eintrag.fertig .nav-nr{background:var(--gruen);color:#fff}
.nav-titel{flex:1}
.nav-status{font-size:.78rem;color:var(--gruen);font-weight:800}
.nav-home{margin-bottom:10px;font-family:'Fredoka',sans-serif}
.nav-pruefung{margin-top:14px;border-top:1px dashed var(--linie);padding-top:14px}
.nav-pruefung .nav-nr{background:var(--gelb);color:#fff}

/* ---------- Startseite ---------- */
.hero{display:flex;gap:32px;align-items:stretch;background:var(--karte);border:1px solid var(--linie);border-radius:calc(var(--radius) + 6px);padding:34px 36px;box-shadow:var(--schatten);margin-bottom:30px;flex-wrap:wrap}
.hero-text{flex:1;min-width:260px}
.hero-eyebrow{margin:0;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--leise);font-weight:800}
.hero-sub{color:var(--leise);max-width:54ch}
.hero-aktionen{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hero-status{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-left:1px dashed var(--linie);min-width:190px}
.ring{--p:0;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--akzent) calc(var(--p)*1%),var(--bg2) 0);position:relative}
.ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--karte)}
.ring span{position:relative;font-family:'Fredoka',sans-serif;font-size:1.45rem;color:var(--akzent-dunkel)}
.ring.klein{width:84px;height:84px}
.ring.klein::before{inset:8px}
.ring.klein span{font-size:1.1rem}
.ring-label{margin:0;font-size:.85rem;color:var(--leise)}
.datum-knopf{border:1px solid var(--linie);background:var(--bg);border-radius:99px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:.82rem;color:var(--leise);cursor:pointer}
.datum-knopf:hover{border-color:var(--akzent);color:var(--akzent-dunkel)}
.datum-wrap{position:relative;display:inline-flex}
.datum-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.grid-titel{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.2rem;margin:0 0 14px}

.modul-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.modul-karte{display:flex;flex-direction:column;gap:6px;background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:20px 22px;text-decoration:none;color:var(--tinte);box-shadow:var(--schatten);transition:transform .15s,border-color .15s}
.modul-karte:hover{transform:translateY(-3px);border-color:var(--akzent)}
.modul-karte.fertig{background:linear-gradient(180deg,var(--gruen-hell),var(--karte) 70%)}
.mk-kopf{display:flex;align-items:center;justify-content:space-between}
.mk-nr{width:34px;height:34px;border-radius:50%;background:var(--akzent-hell);color:var(--akzent-dunkel);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.modul-karte.fertig .mk-nr{background:var(--gruen);color:#fff}
.mk-tag{font-size:.74rem;font-weight:800;color:var(--leise);text-transform:uppercase;letter-spacing:.05em}
.modul-karte h3{margin:.5em 0 0}
.modul-karte p{margin:.2em 0 .6em;font-size:.9rem;color:var(--leise);flex:1}
.mk-fuss{display:flex;gap:8px}
.mk-chip{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--bg2);color:var(--leise)}
.mk-chip.an{background:var(--gruen-hell);color:var(--gruen)}

/* ---------- Knöpfe ---------- */
.knopf{display:inline-block;border:none;border-radius:99px;padding:11px 22px;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center}
.knopf.primaer{background:var(--akzent);color:#fff}
.knopf.primaer:hover{background:var(--akzent-dunkel)}
.knopf.sekundaer{background:var(--karte);color:var(--akzent-dunkel);border:1.5px solid var(--akzent)}
.knopf.sekundaer:hover{background:var(--akzent-hell)}
.knopf.leise{background:none;border:1px solid var(--linie);color:var(--leise);font-size:.82rem;padding:7px 16px}
.knopf.leise:hover{color:var(--tinte)}

/* ---------- Modulseite ---------- */
.modul-kopf{margin-bottom:18px}
.modul-tag{margin:0;font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--leise)}
.tab-leiste{display:flex;gap:8px;border-bottom:2px solid var(--linie);margin-bottom:26px}
.tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 18px;font-size:1rem;color:var(--leise);cursor:pointer}
.tab:hover{color:var(--tinte)}
.tab.aktiv{color:var(--akzent-dunkel);border-bottom-color:var(--akzent)}

.zusammenfassung{background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--schatten);margin-bottom:26px}
.merkliste{margin:0;padding-left:1.2em}
.merkliste li{margin:.45em 0}
.merkliste li::marker{color:var(--akzent)}

.details-bereich h2{margin-top:0}
.detail-box{background:var(--karte);border:1px solid var(--linie);border-radius:14px;margin:10px 0;overflow:hidden}
.detail-box summary{cursor:pointer;padding:14px 20px;font-family:'Fredoka',sans-serif;font-size:1.02rem;color:var(--akzent-dunkel);list-style:none;display:flex;align-items:center;gap:10px}
.detail-box summary::-webkit-details-marker{display:none}
.detail-box summary::before{content:'+';flex:0 0 22px;height:22px;border-radius:50%;background:var(--akzent-hell);color:var(--akzent-dunkel);display:flex;align-items:center;justify-content:center;font-size:1rem}
.detail-box[open] summary::before{content:'–'}
.detail-box[open] summary{border-bottom:1px solid var(--linie);background:linear-gradient(180deg,#FFFDF9,var(--karte))}
.detail-inhalt{padding:6px 22px 18px}
.detail-inhalt p{margin:.7em 0}
.detail-inhalt ul,.detail-inhalt ol{padding-left:1.3em}
.detail-inhalt li{margin:.3em 0}

.merke{background:var(--akzent-hell);border-left:none;border-radius:12px;padding:12px 18px;margin:.9em 0}
.merke p{margin:.2em 0}
.pfeil{font-weight:700}

table.dtab{width:100%;border-collapse:collapse;font-size:.92rem;margin:.8em 0;background:var(--karte)}
.dtab th,.dtab td{border:1px solid var(--linie);padding:8px 12px;text-align:left;vertical-align:top}
.dtab thead th{background:var(--bg2);font-family:'Fredoka',sans-serif;font-weight:500}
.dtab tbody th{background:#FCF8F1;font-weight:800;white-space:nowrap}
.dtab ul{margin:.2em 0;padding-left:1.1em}
table.quad td{width:42%}

.zeitleiste{list-style:none;margin:0;padding:0}
.zeitleiste li{position:relative;padding:6px 0 6px 110px;border-left:none}
.zeitleiste li span{position:absolute;left:0;top:6px;width:95px;font-weight:800;color:var(--akzent-dunkel);font-size:.88rem}
ol.schritte li{margin:.7em 0}
ul.checkliste{list-style:none;padding:0}
ul.checkliste li{padding:6px 0 6px 30px;position:relative}
ul.checkliste li::before{content:'✓';position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:6px;background:var(--gruen-hell);color:var(--gruen);font-size:.8rem;display:flex;align-items:center;justify-content:center;font-weight:800}

.lern-fuss{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}

/* ---------- Quiz ---------- */
.quiz-info p{color:var(--leise);font-size:.92rem;margin:0 0 18px}
.frage-karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:20px 24px;margin:14px 0;box-shadow:var(--schatten)}
.frage-nr{margin:0;font-size:.82rem;font-weight:700;color:var(--leise)}
.optionen{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.option{text-align:left;background:var(--bg);border:1.5px solid var(--linie);border-radius:12px;padding:10px 16px;font-family:'Nunito',sans-serif;font-size:.95rem;color:var(--tinte);cursor:pointer;line-height:1.45}
.option:hover:not(:disabled){border-color:var(--akzent);background:#FFFDF9}
.option:disabled{cursor:default;opacity:.75}
.option.korrekt{background:var(--gruen-hell);border-color:var(--gruen);color:#3E5733;opacity:1;font-weight:700}
.option.falsch{background:var(--rot-hell);border-color:var(--rot);color:var(--rot);opacity:1}
.erklaerung{margin-top:12px;padding:10px 16px;border-radius:12px;font-size:.9rem}
.erklaerung.gut{background:var(--gruen-hell)}
.erklaerung.schlecht{background:var(--rot-hell)}
.quiz-ergebnis{margin:22px 0}
.ergebnis-karte{display:flex;align-items:center;gap:20px;background:var(--karte);border:1.5px solid var(--linie);border-radius:var(--radius);padding:20px 26px;margin-bottom:14px;box-shadow:var(--schatten)}
.ergebnis-karte.bestanden{border-color:var(--gruen);background:linear-gradient(180deg,var(--gruen-hell),var(--karte))}
.ergebnis-karte p{margin:0;color:var(--leise)}

/* ---------- Karteikarten ---------- */
.karten-status{color:var(--leise);font-size:.92rem}
.karten-buehne{display:flex;justify-content:center;margin:14px 0 20px;perspective:1400px}
.lernkarte{position:relative;width:min(620px,100%);min-height:280px;border:none;background:none;cursor:pointer;padding:0;transform-style:preserve-3d;transition:transform .5s;text-align:center}
.lernkarte.gedreht{transform:rotateY(180deg)}
.lk-seite{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 36px;box-shadow:var(--schatten);font-family:'Nunito',sans-serif}
.lk-vorn{background:var(--karte);border:1.5px solid var(--linie)}
.lk-hinten{background:#42513A;color:#F2F4EC;transform:rotateY(180deg)}
.lk-seite em{font-style:normal;font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent)}
.lk-hinten em{color:#B9CCA6}
.lk-seite>span{font-size:1.15rem;font-weight:700;line-height:1.5}
.lk-hinten>span{font-size:1rem;font-weight:600}
.lk-seite small{color:var(--leise);font-size:.78rem}
.karten-aktionen{display:flex;justify-content:center;gap:12px;min-height:48px;align-items:center}
.karten-hinweis{color:var(--leise);font-size:.88rem;margin:0}
.karten-reset{display:flex;justify-content:center;margin-top:26px}
.karte-fertig{background:var(--karte);border:1.5px dashed var(--linie);border-radius:22px;padding:40px;text-align:center;width:min(620px,100%)}
.karte-fertig p{color:var(--leise)}

.leer{color:var(--leise)}

/* ============ Modul-Icons & Akzentfarbe ============ */
.gic{width:1em;height:1em;fill:currentColor;vertical-align:-2px}
.nav-ic{flex:0 0 26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.nav-ic .gic{width:17px;height:17px}
.nav-eintrag.aktiv .nav-ic,.nav-eintrag.fertig .nav-ic{background:#fff}
.mk-kopf{display:flex;align-items:center;gap:10px}
.mk-ic{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--mod,var(--akzent)) 14%,#fff);display:flex;align-items:center;justify-content:center}
.mk-ic .gic{width:22px;height:22px}
.mk-tag{flex:1}
.modul-karte{border-top:3px solid var(--mod,var(--akzent))}
.modul-karte.fertig{border-top-color:var(--gruen)}
.modul-kopf{display:flex;align-items:center;gap:16px}
.modul-kopf-ic{width:54px;height:54px;flex:0 0 54px;border-radius:15px;background:color-mix(in srgb,var(--mod,var(--akzent)) 14%,#fff);display:flex;align-items:center;justify-content:center}
.modul-kopf-ic .gic{width:30px;height:30px}

/* ---------- Modul-Titelfoto ---------- */
.foto-bereich{margin:0 0 26px}
.foto-figur{margin:0;background:var(--karte);border:1px solid var(--linie);border-top:4px solid var(--mod,var(--akzent));border-radius:var(--radius);overflow:hidden;box-shadow:var(--schatten)}
.foto-figur img{display:block;width:100%;height:300px;object-fit:cover;object-position:center 42%}
.foto-figur figcaption{padding:12px 20px;font-size:.9rem;color:var(--leise);line-height:1.45}
.foto-zwei{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.foto-figur.zeichnung img{object-fit:contain;height:240px;background:#F4EEDD;padding:6px}
@media(max-width:640px){.foto-zwei{grid-template-columns:1fr}.foto-figur img{height:220px}}

/* ============ Grafik-Panel ============ */
.grafik-panel{background:linear-gradient(180deg,color-mix(in srgb,var(--mod,var(--akzent)) 8%,#fff),var(--karte));border:1px solid var(--linie);border-top:3px solid var(--mod,var(--akzent));border-radius:var(--radius);padding:22px 26px 26px;box-shadow:var(--schatten);margin-bottom:26px}
.grafik-panel>h2{display:flex;align-items:center;gap:10px;color:color-mix(in srgb,var(--mod,var(--akzent)) 75%,#000)}
.grafik-panel>h2 .gic{width:22px;height:22px;color:var(--mod,var(--akzent))}
.g-titel{font-family:'Fredoka',sans-serif;font-size:1.02rem;color:color-mix(in srgb,var(--mod,var(--akzent)) 72%,#000);margin:0 0 10px}
.grafik-inhalt>.g-titel:not(:first-child){margin-top:6px}
.g-pal-c{--c:var(--mod,var(--akzent))}

/* Balkendiagramm */
.balken-chart{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.balken-zeile{display:flex;align-items:center;gap:10px}
.bl-name{flex:0 0 92px;font-size:.86rem;color:var(--leise);text-align:right}
.balken-zeile.hervor .bl-name{color:var(--tinte);font-weight:800}
.bl-spur{flex:1;background:var(--bg2);border-radius:99px;height:26px;overflow:hidden}
.bl-fuell{height:100%;background:var(--c,var(--akzent));border-radius:99px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;min-width:40px}
.bl-fuell b{color:#fff;font-size:.8rem;font-weight:800}
.bl-pct{flex:0 0 38px;font-size:.82rem;font-weight:800;color:var(--leise)}

/* Statistik-Kacheln */
.stat-kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat-kacheln.vier{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.stat-kachel{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;text-align:center}
.stat-kachel b{display:block;font-family:'Fredoka',sans-serif;font-size:1.5rem;color:var(--mod,var(--akzent));line-height:1.1}
.stat-kachel span{font-size:.8rem;color:var(--leise)}
.stat-kachel.warn b{color:var(--rot)}
.stat-kachel.gut b{color:var(--gruen)}

/* Vergleichskarten */
.vergleich{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.vk{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px}
.vk.hervor{border-color:var(--mod,var(--akzent));box-shadow:0 0 0 2px color-mix(in srgb,var(--mod,var(--akzent)) 22%,#fff) inset}
.vk-icon{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--mod,var(--akzent)) 14%,#fff);color:var(--mod,var(--akzent));display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.vk-icon .gic{width:20px;height:20px}
.vk h4{margin:0 0 4px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:.98rem}
.vk p{margin:0;font-size:.84rem;color:var(--leise)}

/* Mini-Zeitleiste */
.mini-zeit{display:flex;gap:10px;flex-wrap:wrap}
.mz{flex:1;min-width:130px;background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:12px 14px}
.mz span{font-family:'Fredoka',sans-serif;color:var(--mod,var(--akzent));font-size:1.1rem}
.mz.hervor{background:color-mix(in srgb,var(--mod,var(--akzent)) 12%,#fff);border-color:var(--mod,var(--akzent))}
.mz p{margin:2px 0 0;font-size:.84rem;color:var(--leise)}

/* Sicherer Hafen */
.hafen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 4px}
.hafen-kern{width:130px;height:130px;border-radius:50%;background:color-mix(in srgb,var(--mod,var(--akzent)) 16%,#fff);border:2px solid var(--mod,var(--akzent));display:flex;flex-direction:column;align-items:center;justify-content:center;color:color-mix(in srgb,var(--mod,var(--akzent)) 75%,#000);text-align:center}
.hafen-kern .gic{width:30px;height:30px;color:var(--mod,var(--akzent));margin-bottom:4px}
.hafen-kern b{font-family:'Fredoka',sans-serif;font-weight:500}
.hafen-kern span{font-size:.76rem;color:var(--leise)}
.hafen-ring{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hr{background:var(--karte);border:1px solid var(--linie);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:700;color:var(--tinte)}

/* 3 Spalten */
.spalten-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.sp{border:1px solid var(--linie);border-top:4px solid var(--c,var(--akzent));border-radius:14px;padding:14px 16px;background:var(--karte)}
.sp.hervor{background:color-mix(in srgb,var(--c,var(--akzent)) 10%,#fff)}
.sp-kopf{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sp-kopf .gic{width:22px;height:22px;color:var(--c,var(--akzent))}
.sp-kopf h4{margin:0;font-family:'Fredoka',sans-serif;font-weight:500;font-size:1rem;color:color-mix(in srgb,var(--c,var(--akzent)) 70%,#000)}
.sp ul{margin:0;padding-left:1.1em;font-size:.87rem}
.sp li{margin:.25em 0}
.sp p{margin:0;font-size:.87rem;color:var(--leise)}

/* Bild-Merksatz */
.bild-merksatz{background:color-mix(in srgb,var(--mod,var(--akzent)) 10%,#fff);border-radius:12px;padding:13px 18px;margin:16px 0 0;font-size:.92rem}
.bild-merksatz.gut{background:var(--gruen-hell)}
.bild-merksatz.schlecht{background:var(--rot-hell)}

/* Quadranten-Grid */
.quadrant-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}
.qg-eck{}
.qg-spalt{font-family:'Fredoka',sans-serif;font-size:.85rem;text-align:center;align-self:center;color:var(--leise);padding:4px}
.qg-zeile{font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--leise);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.qg-zeile small{font-size:.72rem;writing-mode:horizontal-tb}
.qg-feld{border-radius:12px;padding:12px 14px;border:1px solid var(--linie)}
.qg-feld.gut{background:var(--gruen-hell);border-color:#cfe0c2}
.qg-feld.schlecht{background:var(--rot-hell);border-color:#eccfc8}
.qg-feld b{font-family:'Fredoka',sans-serif;font-weight:500}
.qg-feld p{margin:.2em 0 .5em;font-size:.82rem;color:var(--leise)}
.qg-feld .emo{font-size:.82rem;font-weight:800}

/* Fluss / Ablauf */
.fluss{display:flex;gap:10px;flex-wrap:wrap}
.fl-schritt{flex:1;min-width:130px;position:relative;background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px}
.fl-schritt.mark{background:color-mix(in srgb,var(--mod,var(--akzent)) 12%,#fff);border-color:var(--mod,var(--akzent))}
.fl-schritt.schlecht{background:var(--rot-hell);border-color:#eccfc8}
.fl-ic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--mod,var(--akzent)) 14%,#fff);color:var(--mod,var(--akzent));display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.fl-ic .gic{width:20px;height:20px}
.fl-schritt b{font-family:'Fredoka',sans-serif;font-weight:500;display:block}
.fl-schritt span{font-size:.82rem;color:var(--leise)}
.fl-schritt+.fl-schritt::before{content:'›';position:absolute;left:-11px;top:50%;transform:translateY(-50%);color:var(--mod,var(--akzent));font-size:1.3rem;font-weight:800;z-index:1}

/* Kategorie-Grid */
.kat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kat-grid.klein{grid-template-columns:repeat(auto-fit,minmax(116px,1fr))}
.kat{background:var(--karte);border:1px solid var(--linie);border-radius:13px;padding:13px;text-align:center}
.kat .gic{width:26px;height:26px;color:var(--mod,var(--akzent));margin-bottom:4px}
.kat b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:.92rem}
.kat span{font-size:.76rem;color:var(--leise)}

/* Chips */
.chip-reihe{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--karte);border:1.5px solid var(--mod,var(--akzent));color:color-mix(in srgb,var(--mod,var(--akzent)) 75%,#000);border-radius:99px;padding:7px 15px;font-size:.88rem;font-weight:700}
.chip-reihe.gross .chip{font-size:.98rem;padding:9px 18px;font-family:'Fredoka',sans-serif;font-weight:500}

/* Regler */
.regler{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:16px 18px}
.regler-spur{flex:0 0 160px;height:8px;background:var(--bg2);border-radius:99px;position:relative}
.regler-fuell{position:absolute;left:0;top:0;bottom:0;width:55%;background:var(--mod,var(--akzent));border-radius:99px}
.regler-knopf{position:absolute;left:55%;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--mod,var(--akzent));transform:translate(-50%,-50%)}
.regler-text{flex:1;min-width:200px;font-size:.9rem}

/* Split */
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split{border-radius:14px;padding:14px 16px}
.split.gut{background:var(--gruen-hell)}
.split.schlecht{background:var(--rot-hell)}
.split b{font-family:'Fredoka',sans-serif;font-weight:500;display:block;margin-bottom:3px}
.split span{font-size:.84rem;color:var(--leise)}

/* Körper-Check */
.koerper-check{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.kc{background:var(--karte);border:1px solid var(--linie);border-radius:10px;padding:9px 13px;font-size:.86rem}
.kc-t{display:block;font-weight:800;font-size:.78rem;color:color-mix(in srgb,var(--mod,var(--akzent)) 72%,#000);text-transform:uppercase;letter-spacing:.04em}

/* Emotionen-Chips */
.emo-chips{display:flex;flex-wrap:wrap;gap:8px}
.ec{--c:var(--akzent);background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 72%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:99px;padding:7px 15px;font-size:.86rem;font-weight:700}

/* Steckbriefe */
.steckbrief{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;margin:10px 0}
.sb-kopf{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sb-dot{width:14px;height:14px;border-radius:50%;background:var(--sbc,var(--akzent))}
.sb-kopf h4{margin:0;font-family:'Fredoka',sans-serif;font-weight:500;font-size:1rem}
.sb-zeile{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--linie);font-size:.87rem}
.sb-t{flex:0 0 92px;font-weight:800;color:var(--leise)}
.sb-w{flex:1}
.sb-angst{--sbc:#5E7CA6}.sb-meiden{--sbc:#8A8F8A}.sb-spiel{--sbc:#6F8F5E}.sb-droh{--sbc:#B5503C}
.sb-angst .sb-dot,.sb-meiden .sb-dot,.sb-spiel .sb-dot,.sb-droh .sb-dot{background:var(--sbc)}

/* 4 F */
.vier-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.ff{background:color-mix(in srgb,var(--mod,var(--akzent)) 12%,#fff);border-radius:13px;padding:14px;text-align:center;font-family:'Fredoka',sans-serif;font-size:1.05rem;color:color-mix(in srgb,var(--mod,var(--akzent)) 72%,#000)}
.ff span{display:block;font-family:'Nunito',sans-serif;font-size:.8rem;color:var(--leise);font-weight:600;margin-top:2px}

/* Kette */
.kette{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kg{background:var(--karte);border:1px solid var(--linie);border-radius:10px;padding:7px 12px;font-size:.84rem;font-weight:700}
.kp{color:var(--mod,var(--akzent));font-weight:800;font-style:normal}

/* Wege-Grid */
.wege-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.weg{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;position:relative}
.weg-nr{width:30px;height:30px;border-radius:50%;background:var(--mod,var(--akzent));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;margin-bottom:8px}
.weg b{font-family:'Fredoka',sans-serif;font-weight:500;display:block}
.weg p{margin:.2em 0 0;font-size:.83rem;color:var(--leise)}

/* Regel-Grid */
.regel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.rg{display:flex;align-items:center;gap:11px;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:12px 14px;font-weight:700;font-size:.9rem}
.rg span{flex:0 0 28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--mod,var(--akzent)) 16%,#fff);color:color-mix(in srgb,var(--mod,var(--akzent)) 72%,#000);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif}

/* Leiter */
.leiter{display:flex;flex-direction:column;gap:8px}
.lt{display:flex;align-items:center;gap:12px;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:11px 15px;font-weight:700}
.lt span{flex:0 0 30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--mod,var(--akzent)) 14%,#fff);color:color-mix(in srgb,var(--mod,var(--akzent)) 72%,#000);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif}
.lt.hervor{background:color-mix(in srgb,var(--mod,var(--akzent)) 12%,#fff);border-color:var(--mod,var(--akzent))}
.lt.hervor span{background:var(--mod,var(--akzent));color:#fff}

/* Schleimhäute */
.schleim{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sl{border-radius:13px;padding:13px 15px;border:1px solid var(--linie);border-top:4px solid var(--c,#ccc)}
.sl b{font-family:'Fredoka',sans-serif;font-weight:500;display:block}
.sl span{font-size:.82rem;color:var(--leise)}

/* Eigene Bilder */
.bilder-bereich{margin-top:26px}
.bilder-hinweis{color:var(--leise);font-size:.88rem;margin:.2em 0 14px}
.bilder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

@media (max-width:560px){
  .quadrant-grid{grid-template-columns:1fr}
  .qg-zeile{writing-mode:horizontal-tb;transform:none;flex-direction:row;gap:8px;justify-content:flex-start;padding-top:8px}
  .split-2{grid-template-columns:1fr}
  .fl-schritt+.fl-schritt::before{content:'';}
}

/* ---------- Responsiv ---------- */
@media (max-width: 900px){
  #menue-knopf{display:block}
  .layout{display:block}
  nav#seitenleiste{
    display:none;position:fixed;top:57px;left:0;right:0;bottom:0;z-index:40;
    width:auto;overflow:auto;border-right:none;box-shadow:0 10px 30px rgba(0,0,0,.15);
  }
  nav#seitenleiste.offen{display:block}
  .kopf-fortschritt{display:none}
  #countdown{font-size:.8rem}
  .hero{padding:24px}
  .hero-status{border-left:none;border-top:1px dashed var(--linie);width:100%;padding-top:18px}
  h1{font-size:1.7rem}
}
</style>
</head>
<body>
<header class="kopf">
  <button id="menue-knopf" type="button" aria-label="Menü">☰ Module</button>
  <div class="marke"><span class="pfote" aria-hidden="true"><i></i><i></i><i></i><b></b></span> Schulhund-Lernwelt</div>
  <div id="countdown"></div>
  <div class="kopf-fortschritt">
    <div class="kopf-balken-rahmen"><div id="kopf-balken"></div></div>
    <span id="kopf-prozent">0&nbsp;%</span>
  </div>
</header>
<div class="layout">
  <nav id="seitenleiste" aria-label="Lernmodule"></nav>
  <main id="inhalt"></main>
</div>
<script src="js/inhalte-a.js"></script>
<script src="js/inhalte-b.js"></script>
<script src="js/inhalte-c.js"></script>
<script src="js/inhalte-d.js"></script>
<script src="js/quizfragen.js"></script>
<script src="js/karteikarten.js"></script>
<script src="js/grafiken.js"></script>
<script src="js/inhalte-e.js"></script>
<script src="js/image-slot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
